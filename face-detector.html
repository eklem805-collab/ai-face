
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Face Detector</title>
<style>
body { margin:0; background:black; overflow:hidden; }
#video { width:100vw; height:100vh; object-fit:cover; }
#overlay { position:absolute; top:0; left:0; width:100vw; height:100vh; }
#info { position:absolute; top:10px; left:10px; color:white; background:rgba(0,0,0,0.5); padding:10px; border-radius:5px; font-family:monospace; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
<div id="info">AI Face Detector - YOLOv8 + MLKit<br>FPS: <span id="fps">0</span> | Faces: <span id="count">0</span></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const fpsEl = document.getElementById('fps');
const countEl = document.getElementById('count');
let lastTime = performance.now();
let frames = 0;
let fps = 0;

async function start() {
  try {
    // Try to load face-api models from CDN
    const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@latest/model';
    // Fallback to local if needed
    await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
    await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
    
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      detect();
    };
  } catch (e) {
    document.getElementById('info').innerHTML = 'Error: ' + e.message + '<br>Try: Chrome + HTTPS';
    console.error(e);
  }
}

async function detect() {
  const displaySize = { width: video.videoWidth, height: video.videoHeight };
  faceapi.matchDimensions(canvas, displaySize);
  
  setInterval(async () => {
    const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
    const resized = faceapi.resizeResults(detections, displaySize);
    
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    // Draw boxes (green) + polygons
    resized.forEach(det => {
      const box = det.detection.box;
      ctx.strokeStyle = '#00FF00';
      ctx.lineWidth = 3;
      ctx.strokeRect(box.x, box.y, box.width, box.height);
      
      // Draw landmarks as polygons
      ctx.fillStyle = '#FF00FF';
      det.landmarks.positions.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, 2*Math.PI);
        ctx.fill();
      });
    });
    
    countEl.textContent = detections.length;
    
    frames++;
    const now = performance.now();
    if (now - lastTime > 1000) {
      fps = Math.round(frames * 1000 / (now - lastTime));
      fpsEl.textContent = fps;
      frames = 0;
      lastTime = now;
    }
  }, 100);
}

start();
</script>
</body>
</html>
