name: Build APK

on:
  push:
    branches: [ main, arena/* ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace | tee build.log
          ls -lh app/build/outputs/apk/debug/
      - name: Upload PURPLE APK to main branch via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then echo "No APK"; exit 1; fi
          echo "APK exists $(ls -lh $APK)"
          DEST="ai-face-detector-purple.apk"
          B64=$(base64 -w 0 $APK)
          echo "Base64 len ${#B64}"
          # Try without SHA first (create)
          JSON=$(python3 -c "import json,sys; print(json.dumps({'message':'Add purple APK live camera [skip ci]','content':sys.argv[1],'branch':'main'}))" "$B64")
          curl -v -X PUT -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$JSON" https://api.github.com/repos/${{ github.repository }}/contents/$DEST 2>&1 | head -n 50
          echo ""
          echo "Upload done"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: purple-apk
          path: app/build/outputs/apk/debug/app-debug.apk
