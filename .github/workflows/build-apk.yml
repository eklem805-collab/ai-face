name: Build APK

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Download YOLO models
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f "yolov8n-face.pt" ]; then
            wget -q https://github.com/akanametov/yolo-face/releases/download/1.0.0/yolov8n-face.pt -O yolov8n-face.pt && echo "Downloaded n" || echo "Failed n"
          fi
          ls -lh *.pt 2>/dev/null || echo "No pt"

      - name: Convert models to TFLite
        continue-on-error: true
        run: |
          python3 -m pip install --upgrade pip
          pip install ultralytics tensorflow --quiet
          if [ -f "yolov8n-face.pt" ]; then
            python convert_model.py --model yolov8n-face.pt --out app/src/main/assets/yolov8n-face.tflite --imgsz 640 || echo "fail n"
          fi
          if [ ! -f "app/src/main/assets/yolov8n-face.tflite" ]; then
            touch app/src/main/assets/.keep
          fi
          ls -lh app/src/main/assets/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log

      - name: List APK outputs
        if: always()
        run: |
          find app/build -name "*.apk" -type f | xargs ls -lh || echo "No APK"
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Copy APK to root
        if: always()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./ai-face-detector.apk || echo "No debug APK"
          ls -lh *.apk || true

      - name: Upload APK via GitHub API (bypass git push issues)
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "ai-face-detector.apk" ]; then
            echo "No APK to upload via API"
            exit 0
          fi
          echo "Uploading APK via GitHub Contents API..."
          # Get current file SHA if exists
          SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/contents/ai-face-detector.apk?ref=${{ github.ref_name }} | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
          echo "Existing SHA: $SHA"
          CONTENT=$(base64 -w 0 ai-face-detector.apk)
          if [ -z "$SHA" ]; then
            JSON=$(python3 -c "import json,sys; print(json.dumps({'message':'Add APK via API [skip ci]','content':sys.argv[1],'branch':'${{ github.ref_name }}'}))" "$CONTENT")
          else
            JSON=$(python3 -c "import json,sys; print(json.dumps({'message':'Update APK via API [skip ci]','content':sys.argv[1],'sha':sys.argv[2],'branch':'${{ github.ref_name }}'}))" "$CONTENT" "$SHA")
          fi
          curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$JSON" https://api.github.com/repos/${{ github.repository }}/contents/ai-face-detector.apk | head -c 500
          echo ""
          echo "API upload done"

      - name: Commit APK via git (fallback)
        if: always() && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Pull latest to avoid conflicts
          git pull origin ${{ github.ref_name }} --rebase || true
          cp app/build/outputs/apk/debug/app-debug.apk ./ai-face-detector.apk || true
          git add ai-face-detector.apk 2>/dev/null || true
          git add app/src/main/assets/*.tflite 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Add built APK [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || echo "Push failed"
          fi

      - name: Upload Debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-face-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload to Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AI Face Detector v1.0.${{ github.run_number }}
          body: |
            Автоматическая сборка APK с детектором лиц
            
            - ML Kit Face Detection - боксики + полигоны лица
            - YOLOv8 Face Detection (yolov8n-face.tflite)
            
            Установите ai-face-detector.apk на Android устройство
            Поддерживает yolov8l-face.pt из вашего запроса
            
            Установка:
            1. Скачайте APK из релиза или из корня репозитория (ai-face-detector.apk)
            2. Установите на Android
            3. Дайте разрешение на камеру
            4. Наведите на лицо - увидите бокс!
          files: |
            ai-face-detector.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
