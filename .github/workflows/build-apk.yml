name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          ls -lh app/build/outputs/apk/debug/
      - name: Upload APK artifact (136M)
        uses: actions/upload-artifact@v4
        with:
          name: ai-face-purple-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Create Release with APK via gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v1.0.${{ github.run_number }}-purple
          echo "APK size $(ls -lh app/build/outputs/apk/debug/app-debug.apk)"
          gh release create $TAG --title "AI Face PURPLE $TAG - Live Camera" --notes "Purple pixel font, live camera, targetSdk 34, 136M APK with YOLO" --target main || echo "create exists"
          gh release upload $TAG app/build/outputs/apk/debug/app-debug.apk --clobber
          echo "Release done"
          gh release view $TAG
