name: Build APK

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Download YOLO models
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f "yolov8n-face.pt" ]; then
            wget -q https://github.com/akanametov/yolo-face/releases/download/1.0.0/yolov8n-face.pt -O yolov8n-face.pt && echo "Downloaded n" || echo "Failed n"
          fi
          ls -lh *.pt 2>/dev/null || echo "No pt"

      - name: Convert models to TFLite
        continue-on-error: true
        run: |
          python3 -m pip install --upgrade pip
          pip install ultralytics tensorflow --quiet
          if [ -f "yolov8n-face.pt" ]; then
            python convert_model.py --model yolov8n-face.pt --out app/src/main/assets/yolov8n-face.tflite --imgsz 640 || echo "fail n"
          fi
          if [ ! -f "app/src/main/assets/yolov8n-face.tflite" ]; then
            touch app/src/main/assets/.keep
          fi
          ls -lh app/src/main/assets/

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log

      - name: List APK outputs
        if: always()
        run: |
          find app/build -name "*.apk" -type f | xargs ls -lh || echo "No APK"
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Copy APK to root
        if: always()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./ai-face-detector.apk || echo "No debug APK"
          cp app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk || echo "No debug APK2"
          ls -lh *.apk || true

      - name: Upload APK via Contents API to main branch (modern APK for tablets)
        if: always() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "No APK to upload"
            exit 0
          fi
          echo "Uploading modern APK via Contents API..."
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          DEST="ai-face-detector-modern.apk"
          CONTENT=$(base64 -w 0 $APK_PATH)
          # Get SHA if exists
          SHA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/contents/$DEST?ref=main | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
          echo "Existing SHA: $SHA"
          if [ -z "$SHA" ]; then
            JSON=$(python3 -c "import json,sys; print(json.dumps({'message':'Add modern APK for tablets [skip ci]','content':sys.argv[1],'branch':'main'}))" "$CONTENT")
          else
            JSON=$(python3 -c "import json,sys; print(json.dumps({'message':'Update modern APK for tablets [skip ci]','content':sys.argv[1],'sha':sys.argv[2],'branch':'main'}))" "$CONTENT" "$SHA")
          fi
          curl -s -X PUT -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: application/json" -d "$JSON" https://api.github.com/repos/${{ github.repository }}/contents/$DEST | head -c 1000
          echo ""
          echo "Modern APK upload done"

      - name: Upload Debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-face-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Create Release with APK via gh CLI
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=v1.0.${{ github.run_number }}
          echo "Creating release $TAG"
          gh release create $TAG --title "AI Face Detector $TAG - Modern APK for tablets" --notes "Modern APK with targetSdk 34, works on tablets and phones" --target main || echo "Create failed"
          ls -lh *.apk app/build/outputs/apk/debug/*.apk || true
          gh release upload $TAG app/build/outputs/apk/debug/app-debug.apk --clobber || echo "Upload app-debug failed"
          gh release upload $TAG ./ai-face-detector.apk --clobber || echo "Upload ai-face-detector failed"
          echo "Done"
